[package]
name = "monacotauri"
version = "0.1.0"
description = "A lightweight Monaco-based text editor"
authors = [ "Alex Musichen" ]
license = "MIT"
repository = "https://github.com/musichen/monacotauri"
default-run = "monacotauri"
edition = "2021"
build = "src/build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[[bin]]
name = "monacotauri"
path = "src/main.rs"
